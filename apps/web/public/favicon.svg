<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <!-- radio body -->
  <rect x="12" y="20" width="40" height="26" rx="6" fill="#ffffff"/>
  <!-- antenna mast -->
  <rect x="30.8" y="8" width="2.4" height="12" rx="1.2" fill="#ffffff"/>
  <!-- antenna tip -->
  <circle cx="32" cy="8" r="3" fill="#ffffff"/>
  <!-- speaker grille -->
  <rect x="15" y="27" width="12" height="12" rx="2" fill="none" stroke="#6366f1" stroke-width="1.6"/>
  <line x1="15" y1="31" x2="27" y2="31" stroke="#6366f1" stroke-width="1.6"/>
  <line x1="15" y1="35" x2="27" y2="35" stroke="#6366f1" stroke-width="1.6"/>
  <!-- dial / knob -->
  <circle cx="42" cy="31" r="3.4" fill="#6366f1"/>
  <!-- tuning bar -->
  <rect x="37" y="38" width="13" height="3" rx="1.5" fill="#6366f1"/>
  <!-- signal waves -->
  <path d="M31 45 l1 2 1-2z" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
</svg>