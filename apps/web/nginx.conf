server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2g;

  # Re-resolve container names via Docker's embedded DNS so recreating the api or
  # engine (which changes its IP) never leaves nginx pointing at a stale address
  # (which would surface as a 502). Using a variable in proxy_pass forces this.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ^~ beats the hashed-asset regex below: proxied locations must never be
  # interpreted as local static files (e.g. /media/*.jpg artwork or
  # /widgets/*.js embed scripts would otherwise 404).
  # Direct (server-disk-free) backup downloads can run for hours and be far
  # larger than the server's free space, so their responses must never be
  # spooled to nginx temp files — and the read timeout must not cut them off.
  # NOTE: these prefixes must NOT end in a slash. nginx marks a prefix location
  # ending in "/" as needing a trailing slash, so a request to /api/backups would
  # get a 301 to /api/backups/ instead of reaching the API.
  location ^~ /api/backups/stream {
    set $api_up http://api:8080;
    proxy_pass $api_up$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 12h;
    proxy_send_timeout 12h;
  }

  # Snapshot downloads are just as large as the direct ones and equally unable
  # to be spooled to a temp file. Buffering here also stalled the browser's
  # progress: nginx held the response until its buffers filled, so a big
  # download looked like nothing was happening. (^~ picks the longest prefix, so
  # /api/backups/stream/ above still wins for direct downloads.)
  location ^~ /api/backups {
    set $api_up http://api:8080;
    proxy_pass $api_up$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 12h;
    proxy_send_timeout 12h;
  }

  location ^~ /api/ {
    set $api_up http://api:8080;
    proxy_pass $api_up$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Per-episode social share pages: server-rendered HTML with that episode's
  # Open Graph tags. Must be proxied to the API — the SPA shell is a single
  # generic page, which is why every shared episode used to preview the same.
  # (X-Forwarded-Proto/Host are set by the outer proxy — don't overwrite them
  # here, or share links would be built with the wrong scheme.)
  location ^~ /e/ {
    set $api_up http://api:8080;
    proxy_pass $api_up$request_uri;
    proxy_set_header Host $host;
  }

  location ^~ /media/ {
    set $api_up http://api:8080;
    proxy_pass $api_up$request_uri;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location = /widgets {
    try_files /index.html =404;
  }

  location = /widgets/ {
    try_files /index.html =404;
  }

  location ^~ /widgets/ {
    set $api_up http://api:8080;
    proxy_pass $api_up$request_uri;
    proxy_set_header Host $host;
  }

  location ^~ /ws/ {
    set $api_up http://api:8080;
    proxy_pass $api_up$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location ^~ /live-ws/ {
    set $engine_up http://engine:9002;
    proxy_pass $engine_up$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # index.html must always be revalidated so a redeploy reaches browsers;
  # hashed assets (index-*.js/css) are immutable and safe to cache long.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /index.html =404;
  }

  location ~* \.(js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
