name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A push may be the commit we want a result for; only cancel redundant PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # npm's optional-dependency bug (npm/cli#4828): a lockfile generated on
      # Windows does not install rollup's Linux binary under `npm ci`, so vite
      # and vitest die with "Cannot find module @rollup/rollup-linux-x64-gnu".
      # The Dockerfiles apply the same workaround for Alpine's musl build.
      - name: Ensure rollup's Linux binary
        run: |
          version="$(node -p "require('rollup/package.json').version")"
          npm install --no-save --no-package-lock "@rollup/rollup-linux-x64-gnu@$version"

      - name: Typecheck
        run: npm run typecheck

      # The API suite is unit-level and needs no database. Two tests spawn
      # `sh | tar | gzip`, which is why they only pass on Linux.
      # The engine's audio tests are excluded until they are verified on Linux:
      # they fail on Windows with 0 frames decoded from their ffmpeg fixtures.
      - name: API tests
        run: npm run test -w @airwavehq/api

      - name: Build (api, engine, web, widgets)
        run: npm run build
